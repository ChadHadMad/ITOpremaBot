<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Oprema Bot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .chat-container {
            width: 420px;
            height: 620px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #0078d4, #005a9e);
            color: white;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bot-avatar {
            width: 42px;
            height: 42px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .bot-info h3 { font-size: 16px; font-weight: 600; }
        .bot-info span { font-size: 12px; opacity: 0.85; }

        .status-dot {
            width: 8px; height: 8px;
            background: #4caf50;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }

        .message {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 85%;
        }

        .message.bot { align-self: flex-start; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }

        .message-avatar {
            width: 28px; height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            background: #e3f2fd;
        }

        .message.user .message-avatar { background: #e8f5e9; }

        .bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .bot .bubble {
            background: #f1f3f4;
            color: #202124;
            border-bottom-left-radius: 4px;
        }

        .user .bubble {
            background: linear-gradient(135deg, #0078d4, #005a9e);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .typing {
            display: flex;
            align-items: center;
            gap: 8px;
            align-self: flex-start;
        }

        .typing-bubble {
            background: #f1f3f4;
            padding: 12px 16px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 7px; height: 7px;
            background: #999;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        .input-area {
            padding: 16px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            background: white;
        }

        .input-area input {
            flex: 1;
            padding: 10px 16px;
            border: 1.5px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-area input:focus { border-color: #0078d4; }

        .input-area button {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, #0078d4, #005a9e);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .input-area button:hover { opacity: 0.85; }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <div class="bot-avatar">🤖</div>
        <div class="bot-info">
            <h3>IT Oprema Bot</h3>
            <span><span class="status-dot"></span>Online</span>
        </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
        <input type="text" id="input" placeholder="Upiši poruku..." autocomplete="off" />
        <button id="sendBtn">➤</button>
    </div>
</div>

<script>
    const messagesDiv = document.getElementById("messages");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");

    const conversationId = "conv_" + Math.random().toString(36).substr(2, 9);

    function addMessage(text, sender) {
        const wrapper = document.createElement("div");
        wrapper.className = `message ${sender}`;

        const avatar = document.createElement("div");
        avatar.className = "message-avatar";
        avatar.textContent = sender === "bot" ? "🤖" : "👤";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        wrapper.appendChild(avatar);
        wrapper.appendChild(bubble);
        messagesDiv.appendChild(wrapper);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showTyping() {
        const typing = document.createElement("div");
        typing.className = "typing";
        typing.id = "typing";
        typing.innerHTML = `
            <div class="message-avatar">🤖</div>
            <div class="typing-bubble">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>`;
        messagesDiv.appendChild(typing);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function hideTyping() {
        const t = document.getElementById("typing");
        if (t) t.remove();
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, "user");
        input.value = "";
        sendBtn.disabled = true;
        showTyping();

        try {
            const response = await fetch("http://localhost:3978/api/messages", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    type: "message",
                    id: Math.random().toString(36).substr(2, 9),
                    timestamp: new Date().toISOString(),
                    channelId: "webchat",
                    conversation: { id: conversationId },
                    from: { id: "user1", name: "Korisnik" },
                    recipient: { id: "bot", name: "IT Oprema Bot" },
                    text: text
                })
            });

            const data = await response.json();
            hideTyping();

            if (data.text) {
                addMessage(data.text, "bot");
            }
        } catch (err) {
            hideTyping();
            addMessage("Greška pri spajanju na bota. Provjeri je li server pokrenut.", "bot");
        }

        sendBtn.disabled = false;
        input.focus();
    }

    input.addEventListener("keypress", e => {
        if (e.key === "Enter") sendMessage();
    });

    sendBtn.addEventListener("click", sendMessage);

    setTimeout(() => {
        addMessage("Pozdrav! Ja sam IT Oprema Bot 🤖\n\nPomažem ti pronaći odgovarajuću IT opremu.\n\nŠto te zanima?\n1️⃣ Laptop\n2️⃣ Router\n3️⃣ Periferija (miš, tipkovnica, monitor...)", "bot");
    }, 500);
</script>
</body>
</html>
